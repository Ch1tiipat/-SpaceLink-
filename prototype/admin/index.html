<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>SpaceLink Admin Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style.css" />
  <style>
    .app-shell{grid-template-columns:280px minmax(0,1fr)}.app-shell>main{grid-column:2;grid-row:1;min-width:0}.sidebar{position:fixed;inset:0 auto 0 0;width:280px;height:100vh;z-index:4;overflow-y:auto}.side-bottom{margin-top:28px;padding-top:0}.side-bottom .user{border-top:1px solid var(--line);padding-top:16px}.sidebar-toggle{margin-left:auto;width:30px;height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;display:grid;place-items:center;color:var(--p);cursor:pointer}.sidebar-toggle:hover{background:#f0eafa}.app-shell.sidebar-collapsed{grid-template-columns:78px minmax(0,1fr)}.app-shell.sidebar-collapsed .sidebar{width:78px;padding-left:14px;padding-right:14px}.app-shell.sidebar-collapsed .brand{padding-left:4px}.app-shell.sidebar-collapsed .brand-copy,.app-shell.sidebar-collapsed .nav-link{font-size:0}.app-shell.sidebar-collapsed .nav-link{justify-content:center;gap:0}.app-shell.sidebar-collapsed .nav-link svg{width:20px;height:20px}.app-shell.sidebar-collapsed .side-bottom .user>div:not(.avatar),.app-shell.sidebar-collapsed .side-bottom .nav-link{font-size:0}.app-shell.sidebar-collapsed .side-bottom .nav-link{justify-content:center}.app-shell.sidebar-collapsed .sidebar-toggle{position:absolute;right:-14px;top:22px;background:var(--p);color:#fff;border-color:var(--p);z-index:5}.app-shell.sidebar-collapsed .sidebar-toggle svg{transform:rotate(180deg)}.support-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-bottom:24px}.support-layout{display:grid;grid-template-columns:1.65fr .8fr;gap:24px}.ticket-title{font-weight:800;font-size:13px}.ticket-meta{font-size:10px;color:var(--muted);margin-top:5px}.support-note{padding:19px 23px;line-height:1.55}.support-note h3{font-size:13px;margin:0 0 8px}.support-note p{font-size:11px;color:var(--muted);margin:0 0 15px}.ticket-row{cursor:pointer}.ticket-row:hover{background:#fbf7ff!important}.ticket-row.selected{background:#f1eafb!important}@media(max-width:1000px){.app-shell{grid-template-columns:78px minmax(0,1fr)}.sidebar{width:78px}.side-bottom{margin-top:20px}.brand-copy,.nav-link{font-size:0}.nav-link{justify-content:center;gap:0}.nav-link svg{width:20px}.sidebar-toggle{display:none}}@media(max-width:650px){.app-shell,.app-shell.sidebar-collapsed{grid-template-columns:1fr}.app-shell>main{grid-column:1}.sidebar{position:static;width:auto;height:auto}.support-summary,.support-layout{grid-template-columns:1fr}}
    #auth-screen{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#281c4ccc,#6846a3c4),url('https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&fit=crop&w=1600&q=85') center/cover;backdrop-filter:blur(4px)}.login-card{width:min(410px,100%);padding:34px;background:#fffaff;border-radius:18px;box-shadow:0 24px 70px #130c275c;text-align:center}.login-mark{display:grid;place-items:center;width:52px;height:52px;margin:auto;border-radius:13px;background:var(--p);color:#fff}.login-card h1{margin:14px 0 5px;color:var(--p);font-size:28px}.login-card p{margin:0 0 25px;color:var(--muted);font-size:12px;line-height:1.5}.login-card form{text-align:left}.login-card label{display:block;margin:12px 0 6px;font-size:10px;font-weight:800;color:#554c60}.login-card input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;outline:0}.login-card input:focus{border-color:var(--p);box-shadow:0 0 0 3px #e5daf6}.login-card form button{width:100%;margin:20px 0 13px}.login-card small{font-size:10px;color:var(--muted)}.floor-map{display:block!important;padding:14px!important;position:relative;min-height:430px;background:#f7f3fa}.floor-map img{display:block;max-width:100%;width:100%;height:400px;object-fit:contain;background:#fff;border-radius:9px}.map-caption{position:absolute;bottom:25px;left:28px;padding:8px 10px;border-radius:6px;background:#251844d9;color:#fff;font-size:10px}.calendar-selects{display:flex;gap:5px}.calendar-selects select{padding:5px;border:1px solid var(--line);border-radius:5px;background:#fff;font-size:10px}.date-choice{cursor:pointer}.date-choice:hover{background:#eee5fa;border-radius:5px}.receipt-wrap{display:grid;grid-template-columns:1.7fr .7fr;gap:24px}.receipt{padding:30px;position:relative}.receipt-head{display:flex;justify-content:space-between;padding-bottom:24px;border-bottom:1px solid var(--line)}.receipt-head .brand-icon{display:inline-grid;vertical-align:middle;margin-right:8px}.receipt-head h2{display:inline;color:var(--p)}.receipt-head small,.receipt-grid span{display:block;color:var(--muted);font-size:11px;margin-top:4px}.receipt-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px;padding:25px 0}.receipt-grid label{display:block;color:var(--muted);font-size:10px;font-weight:800;margin-bottom:8px}.receipt-total{display:flex;justify-content:space-between;align-items:center;padding:20px 0;font-size:11px}.receipt-total strong{font-size:20px;color:var(--p)}.receipt-stamp{margin-left:auto;width:max-content;border:3px solid #198a62;color:#198a62;padding:7px 9px;font-weight:800;transform:rotate(-6deg)}.receipt-side{padding:25px;height:max-content}.receipt-side h3{font-size:14px}.receipt-side p{font-size:11px;line-height:1.6;color:var(--muted)}@media(max-width:850px){.receipt-wrap{grid-template-columns:1fr}.floor-map{min-height:300px}.floor-map img{height:270px}}
    .sidebar .side-bottom{margin-top:auto!important}
    .content{width:min(100%,1280px)!important;padding-top:34px!important}.page-head{min-height:58px;gap:18px;margin-bottom:24px!important}.page-head .actions{flex-wrap:wrap;justify-content:flex-end}.stats,.mini-stats{gap:18px!important;margin-bottom:24px!important}.stat{min-height:148px!important;padding:20px!important}.dash-grid,.bottom-grid,.two-col,.announcement-layout,.gov-grid,.rating-layout{gap:22px!important}.table-card{margin-top:20px!important}.footer-cards{gap:22px!important;margin-top:22px!important}.card-title{padding:22px 24px 0!important}.chart-box{padding:18px!important}.filterbar{padding:0!important;margin:0 0 18px!important;min-height:48px;flex-wrap:wrap}.filter-control{display:inline-flex;align-items:center}.filter-field{height:37px;min-width:145px;padding:0 11px;border:1px solid #d5c9df;border-radius:8px;background:#fffaff;color:#51495c;font:11px Inter,Arial,sans-serif;outline:0}.filter-field:focus{border-color:var(--p);box-shadow:0 0 0 3px #e8def7}.filter-search{min-width:265px}.filter-select{cursor:pointer}.date-range{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:10px}.date-range .filter-field{min-width:132px}.filterbar>.btn{height:37px}.table-wrap{border-radius:0}.support-layout>.card,.announcement-layout>.card{min-width:0}@media(max-width:850px){.filter-search{min-width:220px}.page-head{align-items:flex-start}.page-head .actions{justify-content:flex-start}.stat{min-height:132px!important}}
    .gov-grid>.card{align-self:start}.gov-grid{align-items:start}.slots{grid-template-columns:repeat(5,1fr)!important;min-height:0!important;padding:22px 28px!important;gap:12px!important}.slot{min-height:62px;display:flex;flex-direction:column;justify-content:center}.bottom-grid{align-items:start}.bottom-grid>.card{min-height:0}.floor-map{height:460px!important;min-height:0!important;padding:0!important;overflow:hidden;background:#f7f3fa!important}.map-viewport{height:100%;display:grid;place-items:center;overflow:auto;background:#fff}.map-viewport img{width:auto!important;max-width:none!important;height:390px!important;max-height:none!important;object-fit:contain!important;transition:transform .2s ease;transform-origin:center}.map-toolbar{position:absolute;z-index:2;top:14px;right:14px;display:flex;align-items:center;gap:5px;padding:6px;border:1px solid var(--line);border-radius:9px;background:#fff;box-shadow:0 4px 13px #321e5718}.map-toolbar span{min-width:39px;font-size:10px;font-weight:800;text-align:center;color:var(--p)}.map-zoom{width:28px;height:28px;border:0;border-radius:5px;background:#f1eafa;color:var(--p);display:grid;place-items:center;cursor:pointer}.map-zoom:hover{background:var(--p);color:#fff}.map-zoom svg{width:15px}.map-caption{display:none!important}@media(max-width:850px){.floor-map{height:340px!important}.map-viewport img{height:290px!important}.slots{grid-template-columns:repeat(3,1fr)!important}}
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar"><div class="brand"><span class="brand-icon"><i data-lucide="rocket"></i></span><div class="brand-copy"><b>SpaceLink</b><small>ADMIN CONSOLE</small></div><button class="sidebar-toggle" id="sidebar-toggle" aria-label="Collapse sidebar"><i data-lucide="panel-left-close"></i></button></div>
      <nav id="nav"><button class="nav-link active" data-view="dashboard"><i data-lucide="layout-dashboard"></i>Dashboard</button><button class="nav-link" data-view="zones"><i data-lucide="grid-3x3"></i>Zone &amp; Slot</button><button class="nav-link" data-view="bookings"><i data-lucide="calendar-check"></i>Booking</button><button class="nav-link" data-view="payments"><i data-lucide="wallet-cards"></i>Payment</button><button class="nav-link" data-view="governance"><i data-lucide="shield-alert"></i>Penalty / Blacklist</button><button class="nav-link" data-view="announcements"><i data-lucide="megaphone"></i>Announcements</button><button class="nav-link" data-view="reviews"><i data-lucide="star"></i>Reviews</button><button class="nav-link" data-view="support"><i data-lucide="headset"></i>Support Center</button></nav>
      <div class="side-bottom"><div class="user"><div class="avatar purple">SL</div><div><b>SpaceLink Admin</b><small>System administrator</small></div></div><button class="nav-link"><i data-lucide="log-out"></i>Log out</button></div>
    </aside>
    <main><header class="topbar"><div class="search"><i data-lucide="search"></i><input placeholder="Search bookings, users, or zones..." /></div><div class="top-actions"><button class="icon-btn"><i data-lucide="bell"></i><em></em></button><button class="icon-btn"><i data-lucide="settings-2"></i></button><a href="#" id="support-link">Support</a></div></header><section id="content" class="content"></section></main>
  </div>
  <div id="modal-root"></div>
  <script src="../assets/store.js"></script>
  <script>
    // Unified-login guard: must be signed in as an admin, else back to login.
    if (window.SpaceLinkStore.requireRole('admin', '../index.html')) {
      // Satisfy enhancements.js's own auth check so it doesn't show a 2nd login.
      sessionStorage.setItem('spacelink-admin', '1');
    } else {
      throw new Error('redirecting to login');
    }
  </script>
  <script src="script.js"></script><script src="enhancements.js"></script>
</body></html>
